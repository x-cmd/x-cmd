# Rule: skill0-writer mechanical checks.
# Enforces the writing conventions documented in
# lib/skill0/core/skill0-writer/SKILL.md (and the yfm skill).
# Mechanical first-pass — clarity / 80-20 / semantic checks remain the
# agent's responsibility via x rule check.

sw-100-yfm-required:
  name: SKILL.md starts with a YAML front matter block
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "Every SKILL.md must start with a YAML front matter block delimited by --- lines."
  - "A file without YFM is invisible to the agent filter and treated as dead text."

sw-105-no-yfm-in-subfiles:
  name: only SKILL.md carries YFM; sub-files start at the heading
  apply: "lib/skill0/*/**/*.md"
  level: error
  desc:
  - "Only SKILL.md (and SKILL.cn.md) may have YAML front matter. Every other .md must start at its `#` heading."
  - "Rationale: SKILL.md is what a loader filters on, so it needs name/description. Sub-files are read directly by an agent that already opened them — YFM there is pure token cost and only restates what the title says."
  - "This covers references/*, usecase/*, EXAMPLE.md, *.report.md, CLEANUP.md, data/*.md — everything that is not a graph root."
  - "Deviation requires a reason stated in the file itself. 'It looked tidy' is not a reason."
  - "Structured data that is content, not metadata (install methods, risk tables), belongs in the body as prose or a table — not smuggled into a YFM block."
  tldr:
  - wrong: "references/PILLOW.md opening with ---\\nname: meme-pillow\\ndescription: ...\\n---"
  - right: "references/PILLOW.md opening with `# Pillow Backend`"

sw-110-yfm-name-present:
  name: YFM has a name field
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "SKILL.md YFM must include name: — it must equal the surrounding directory name."
  - "name is what agent loaders key on to surface the skill."
  tldr:
  - wrong: "no name: in YFM"
    right: "name: skill0-writer"

sw-120-yfm-description-present:
  name: YFM has a description field
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "description: is 1-2 sentences written for an agent to decide whether to load this skill."

sw-130-name-format:
  name: name field is kebab-case
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "name: must be kebab-case (lowercase letters, digits, hyphens)."
  - "For SKILL.md, must equal the surrounding directory name exactly."
  tldr:
  - wrong: "name: skill0_writer"
  - right: "name: skill0-writer"

sw-140-name-length:
  name: name field is short
  apply: "lib/skill0/*/*/SKILL.md"
  level: warn
  desc:
  - "name: should be ≤ 30 chars. Longer names pollute skill cards and git logs."
  - "If you find yourself needing more, the description is where elaboration goes."

sw-145-no-custom-namespace:
  name: extended fields go under `metadata:`, not a custom namespace
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "Extended fields nest under `metadata:` — the Agent Skills standard extension point."
  - "Do not invent a parallel top-level namespace for them (`x-*:`, `*-meta:`, `extra:`, etc.)."
  - "Top level is a closed set: name, description, license, compatibility, metadata, allowed-tools."
  - "See the yfm skill for the full convention."
  tldr:
  - wrong: "custom-meta:\n  related: [git, devloop]"
  - right: "metadata:\n  related: \"git,devloop\""

sw-150-metadata-minimal:
  name: metadata only carries `related:` (plus pointers for data skills)
  apply: "lib/skill0/*/*/SKILL.md"
  level: warn
  desc:
  - "Default metadata: just `related: \"comma,separated,skill,slugs\"` for navigation."
  - "Data skills (data/*) may add `x-cmd-mod` / `datasource` / `upstream` pointers."
  - "Values are scalar strings — lists written comma-separated, never YAML sequences."
  - "Avoid:"
  - "`owner:` — constant across skills (lijunhao owns all of them); redundant."
  - "`status:` — almost always 'stable'; rarely informative, drifts."
  - "`type:` (Tool / Framework / Convention) — derivable from description; trust the agent to infer category from context."
  - "If you find yourself wanting to add another field, ask whether `description:` or `related:` already covers it. If yes, don't add the field."
  - "Omit an empty key rather than writing `related: \"\"`."
  tldr:
  - right: "metadata:\n  related: \"git,devloop,rule\""
  - wrong: "metadata:\n  type: Tool\n  status: stable\n  related: [git]\n  owner: person:lijunhao"

sw-200-line-count:
  name: SKILL.md ≤ 100 lines (ideal 50)
  apply: "lib/skill0/*/*/SKILL.md"
  level: warn
  desc:
  - "Hard limit 100 lines, ideal 50. Agents may truncate at ~50 — the first 50 must be self-sufficient."
  - "Detail beyond 50 still goes in, but pyramid structure: critical info first."
  tldr:
  - wrong: "SKILL.md with 224 lines and a sub-process description inline"
  - right: "SKILL.md with 75 lines; workflow detail moved to references/WORKFLOW.md"

sw-300-minimize-blank-lines:
  name: minimize blank lines between sections
  apply: "lib/skill0/*/*/SKILL.md"
  level: info
  desc:
  - "Every blank line counts against agent truncation. Keep vertical whitespace minimal between sections."
  - "A single blank line is required between a heading and its first paragraph; more than one is wasteful."

sw-350-no-prose-hard-wrap:
  name: prose paragraphs are not hard-wrapped
  apply: "lib/skill0/**/*.md"
  level: warn
  desc:
  - "Markdown in skill0 is read by an LLM, not printed in a terminal."
  - "Hard-wrapping prose — breaking a single sentence across multiple
    lines, or splitting a paragraph into multiple line-broken blocks —
    makes the LLM treat each line as a separate logical unit, which
    fragments the meaning."
  - "Format: one sentence per line; a blank line separates paragraphs."
  - "If a sentence is genuinely too long for your editor, leave it.
    Readability on screen is not the goal — the LLM reads the whole
    paragraph as one unit anyway."
  - "Code blocks, tables, YFM, headings, list items, and other
    structured elements are exempt — they have their own line semantics."
  tldr:
  - wrong: "A 100-char sentence split at column 80 into two lines."
  - wrong: "Two prose lines that are obviously halves of one sentence
            (e.g., 'All clones converge...' newline 'at ~/.x-repo/...')."
  - right: "Each sentence on its own line. Blank line between paragraphs."

sw-400-english-prose:
  name: skill0 docs are English by default; CJK for Chinese-domain skills
  apply: "lib/skill0/*/*/SKILL.md"
  level: error
  desc:
  - "skill0's corpus is English by default. The locale variant SKILL.cn.md
    (e.g., score/SKILL.cn.md) carries the full Chinese translation when a
    skill serves a Chinese audience in detail."
  - "The apply glob above is narrow on purpose — it points at the rule's
    mechanical target. Language consistency is one skill0 convention, not
    several: sub-files in the same tree follow the same default. If a
    usecase/ or references/ file is written in Chinese, that is a violation
    of this convention even though no automated check fires on it. The
    reason: those files are reference material the collector / agent reads
    to learn conventions, and a Chinese reference set leaks Chinese habits
    into downstream output."
  - "Domain exception — and this is the *only* lever. A skill whose
    PURPOSE is to serve a Chinese-domain task may use CJK content
    in the body. The signal is in the description: it names the
    skill as serving a Chinese-domain task (e.g., ccal's
    description says 'China-region calendar'). When the description
    declares the domain, the body can use CJK keywords for the
    concepts the skill works on (调休, 节气, 黄历宜凶 etc.) and
    short annotations that elaborate them."
  - "This is not a proportion-based carve-out. The decision is
    about the skill's domain and its target audience, not about
    how much CJK is sprinkled into the prose. Skill purpose
    drives CJK permission; sentence-level CJK / English mixing is
    incidental."
  - "Even for Chinese-domain skills: long-form Chinese prose in
    body still belongs in SKILL.cn.md. CJK is for keywords and
    short domain-concept annotations. The English body for a
    Chinese-domain skill is still English in form; the CJK
    keywords are how the agent search-matches the canonical terms."
  - "For non-Chinese-domain skills (time, csv, ip, agent-browser,
    knowledge, etc. — anything that does not declare a Chinese-
    domain task in its description): any non-trivial CJK in body
    is a violation."
  - "Comment strings inside fenced code blocks are exempt."
  tldr:
  - wrong: "Non-Chinese-domain SKILL with bulk Chinese prose in
            body. That paragraph goes in SKILL.cn.md."
  - wrong: "Chinese-domain skill using a body section entirely
            composed in Chinese. SKILL.md body should still be
            English in form; full Chinese belongs in SKILL.cn.md."
  - right: "Chinese-domain skill (e.g., ccal — description says
            'China-region') using body English prose with CJK
            keywords as annotation tokens. The description lists
            the keywords; the body elaborates each one in English
            with the CJK keyword attached."
  - exempt: "Fenced code blocks. Header lines. Inline labels
            naming Chinese concepts."

sw-500-no-motivational-intro:
  name: no motivational intro
  apply: "lib/skill0/*/*/SKILL.md"
  level: info
  desc:
  - "Don't open with phrases like 'agent-browser is a tool that...' or 'let's get started'."
  - "Pyramid principle: most important information first."

sw-600-no-trailing-conclusion:
  name: no trailing summary
  apply: "lib/skill0/*/*/SKILL.md"
  level: info
  desc:
  - "Don't end with 'in summary', 'to recap', or 'that wraps up' type paragraphs."
  - "End at a Related section or terse stop."

sw-700-section-order-hint:
  name: section order — install/setup first
  apply: "lib/skill0/*/*/SKILL.md"
  level: info
  desc:
  - "Recommended section order: install / setup → most important usage → advanced / secondary → links."
  - "Don't put usage before install/setup — without it nothing else works."

sw-800-no-repeated-content:
  name: don't repeat content across files
  apply: "lib/skill0/*/*/SKILL.md"
  level: info
  desc:
  - "Link to a separate file via [Title](file.md) instead of duplicating paragraphs."
  - "Code blocks are exempt — they are reference material, not prose."

sw-1000-no-orphan-docs:
  name: no orphan documents in skill0 docs
  apply: "lib/skill0/*/**/*.md"
  level: error
  desc:
  - "Every .md under lib/skill0/{core,data,it,life}/ that is NOT a graph root (SKILL.md / SKILL.cn.md) must be referenced from at least one SKILL.md or SKILL.cn.md."
  - "References count: Markdown link, bare filename, or relative path."
  - "Forward link required (no orphans). Back-link to parent SKILL.md is **optional** — a usecase file's parent is implicit by its path, and a 'Parent skill' back-link in every sub-file is decorative noise. The forward link is what makes the file discoverable; the back-link does not."
  - "SKILL.md and SKILL.cn.md are roots of the doc graph — they are exempt from the parent-link requirement but still must reference their sub-files."
  - "Orphans are invisible to agents — they'll never be read."
  tldr:
  - wrong: "references/GUIDELINES.md exists in meme/ but no SKILL.md links to it"
  - right: "SKILL.md links to references/GUIDELINES.md; GUIDELINES.md does not need a back-link to ../SKILL.md"

sw-1100-no-description-body-duplication:
  name: body leading paragraph must not restate YFM description
  apply: "lib/skill0/*/*/SKILL.md"
  level: warn
  desc:
  - "Skills loaders (Claude Code, Cursor, Continue) load the YFM
    description into the catalog before the body — description is the
    agent's matching / decision layer, body is reference loaded
    on-demand."
  - "Body's leading paragraph must not re-state surface content
    from description (feature list, capabilities, load triggers).
    The body should *expand* on details description can't carry, not
    second-summary the same bullets."
  - "If description already enumerates what the skill does and when
    to load it, the body opens with reference content: a Quick Start
    block, a schema section, usage examples, or a glossary defining
    terms that description cannot spell out."
  - "Practical test: delete the description entirely and read only
    the first 30 lines of the body. The agent should still see what
    the skill does and when to load it. If only description carries
    that load, the body has nothing to add at the top — move the
    unique gloss / rule / definition the body actually contributes
    to the front, drop the rest."
  tldr:
  - wrong: "Body opens with 'This skill handles X, Y, Z.' — a second
            summary of features the YFM description already lists.
            The opening adds no new detail; it just duplicates."
  - right: "Body opens with a rule gloss or definition that description
            cannot spell out — e.g., for ccal, '调休 = a weekend may
            be borrowed to make a weekday-off, or a weekday given back
            when a holiday falls on a weekend.' That gloss is body-
            only; the description lists 调休 as a keyword but does
            not explain the convention."

sw-1200-no-common-knowledge-padding:
  name: don't elaborate common knowledge
  apply: "lib/skill0/*/**/*.md"
  level: warn
  desc:
  - "If a convention word plus one or two sentences already conveys
    the point, stop there. Do not expand it into a section."
  - "The reader is an agent that already knows what YAML, git, HTTP,
    a list, and a cache are. Restating them buys nothing and costs
    context that the skill's actual convention needs."
  - "Name the convention, state the rule, move on. Reserve the prose
    for what is specific to this repo — the part the agent cannot
    infer from general knowledge."
  - "Justification is the usual offender. A rule does not need a
    paragraph defending it. Give the reason only when the rule looks
    wrong without it, and give it in one clause."
  - "This is the same 80-20 instinct as sw-200 line-count, applied
    per-paragraph rather than per-file."
  tldr:
  - wrong: "A 'Why YAML front matter matters' section explaining that
            metadata helps tools index documents."
  - right: "'Extended fields go under metadata:.' One line, no defence."

sw-1250-table-only-for-matrices:
  name: tables only for real matrices; data goes to TSV
  apply: "lib/skill0/*/**/*.md"
  level: warn
  desc:
  - "A markdown table costs pipes, padding, and an alignment row on
    every line. Earn it or drop it."
  - "Use a table when the shape is genuinely two-dimensional: 3+ columns
    whose rows must be compared across them, OR two columns that are two
    parallel SUBJECTS being contrasted (Pillow vs ImageMagick, objective
    vs subjective) — there the header carries meaning."
  - "A two-column key-to-value table is a list wearing table syntax.
    `Command | Description`, `File | Role`, `Mode | Description` — the
    header says nothing the rows don't. Write `- key — value` lines."
  - "A dataset is not documentation. Put it in an external .tsv next
    to the doc and link it — then `x tsv` can filter and query it,
    which no markdown table allows."
  - "For enumerations pick the lightest form that works: inline prose
    for 2-3 short items, a bullet list beyond that, a nested list only
    when the items genuinely nest."
  tldr:
  - wrong: "| 项 | 约定 |\n|---|---|\n| key | metadata.tags |\n| type | string |
            — two columns, no cross-row comparison. Use a list."
  - right: "A 4-column dialect matrix, or a 2-column Pillow-vs-ImageMagick
            where every row is read against the others."
  - right: "300 rows of holiday dates in holidays.tsv, linked from
            SKILL.md, queried with `x tsv`."
